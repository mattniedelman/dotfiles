id: no-hardcoded-secret
language: python
severity: error
message: |
  Possible hardcoded secret. Use environment variables or a secrets manager.

rule:
  kind: assignment
  all:
    - has:
        kind: identifier
        field: left
        regex: "(?i)(password|passwd|secret|api_key|apikey|token|auth|credential|private_key)"
    - has:
        kind: string
        field: right
        not:
          any:
            - regex: '^""$'
            - regex: "^''$"

note: |
  Hardcoded secrets in source code are a security risk:
  - Exposed in version control history
  - Visible to anyone with code access
  - Difficult to rotate
  - May leak in logs or error messages

  Instead of:
    password = "super_secret_123"
    api_key = "sk-abc123..."
    auth_token = "bearer_xyz"

  Use pydantic-settings:
    from pydantic_settings import BaseSettings

    class Settings(BaseSettings):
        password: SecretStr
        api_key: SecretStr

    settings = Settings()  # Reads from environment

  Or a secrets manager:
    from aws_secretsmanager import get_secret
    password = get_secret("my-app/password")

  For local development, use .env files (not committed):
    # .env
    PASSWORD=local_dev_password

  This rule only flags assignments where the value is a string literal.
  It will NOT flag:
    password = settings.password  # Reading from config
    api_key = get_secret("key")   # Fetching from secrets manager
