id: no-namedtuple
language: python
severity: warning
message: |
  Use Pydantic BaseModel instead of namedtuple.

rule:
  any:
    - pattern: "namedtuple($$$ARGS)"
    - pattern: "from collections import namedtuple"
    - pattern: "from typing import NamedTuple"

note: |
  Pydantic provides validation, serialization, and better IDE support.
  
  Instead of:
    from collections import namedtuple
    Point = namedtuple('Point', ['x', 'y'])
  
  Or:
    from typing import NamedTuple
    class Point(NamedTuple):
        x: float
        y: float
  
  Use:
    from pydantic import BaseModel
    
    class Point(BaseModel):
        x: float
        y: float

