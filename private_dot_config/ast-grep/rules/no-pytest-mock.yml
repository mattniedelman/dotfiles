id: no-pytest-mock
language: python
severity: error
message: |
  Avoid using pytest-mock (mocker fixture). Use real implementations,
  dependency injection, or lightweight test fakes instead.

rule:
  any:
    - pattern: from pytest_mock import $$$
    - pattern: import pytest_mock

note: |
  From core-development-rules.md:
  "Anti-Mocking Philosophy - Mocking often papers over design issues"
  
  Preferred alternatives:
  - Dependency injection with real implementations
  - In-memory databases (SQLite, DuckDB) for database tests
  - Lightweight test implementations (fakes)
  - Extract pure functions that don't need mocking
  - pytest fixtures with real objects

