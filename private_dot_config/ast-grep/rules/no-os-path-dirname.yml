id: no-os-path-dirname
language: python
severity: warning
message: |
  Avoid os.path.dirname(). Use pathlib.Path.parent instead.

rule:
  pattern: os.path.dirname($PATH)

fix: Path($PATH).parent

note: |
  From python-development.md:
  "Use pathlib.Path not os.path"
  
  Instead of:
    parent = os.path.dirname(file_path)
  
  Use:
    parent = Path(file_path).parent

