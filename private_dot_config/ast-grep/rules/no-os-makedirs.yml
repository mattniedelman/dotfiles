id: no-os-makedirs
language: python
severity: warning
message: |
  Use Path.mkdir(parents=True) instead of os.makedirs().

rule:
  any:
    - pattern: "os.makedirs($$$ARGS)"
    - pattern: "from os import makedirs"

note: |
  pathlib provides a cleaner interface for directory creation.

  Instead of:
    import os
    os.makedirs(path, exist_ok=True)

  Use:
    from pathlib import Path
    Path(path).mkdir(parents=True, exist_ok=True)
