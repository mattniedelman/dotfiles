id: no-nested-class-in-function
language: python
severity: error
message: |
  Classes defined inside functions are prohibited.
  Extract the class to module level.

rule:
  kind: class_definition
  inside:
    stopBy: end
    kind: function_definition

note: |
  From core-development-rules.md:
  "NEVER define classes inside functions"
  
  Instead of:
    def create_handler():
        class Handler:
            def handle(self):
                pass
        return Handler()
  
  Use:
    class Handler:
        def handle(self):
            pass
    
    def create_handler():
        return Handler()

