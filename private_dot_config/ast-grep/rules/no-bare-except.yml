id: no-bare-except
language: python
severity: error
message: |
  Catch specific exceptions instead of using bare except or except Exception.

rule:
  any:
    - pattern: |
        try:
            $$$BODY
        except:
            $$$HANDLER
    - pattern: |
        try:
            $$$BODY
        except Exception:
            $$$HANDLER
    - pattern: |
        try:
            $$$BODY
        except Exception as $E:
            $$$HANDLER

note: |
  Bare except and except Exception catch too much, including
  KeyboardInterrupt and SystemExit, hiding bugs and making
  debugging difficult.

  Instead of:
    try:
        do_something()
    except:
        handle_error()

  Or:
    try:
        do_something()
    except Exception as e:
        handle_error(e)

  Use specific exceptions:
    try:
        do_something()
    except (ValueError, KeyError) as e:
        handle_error(e)
