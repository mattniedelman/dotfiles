id: no-dataclass
language: python
severity: error
message: |
  ABSOLUTE PROHIBITION: dataclass is NEVER allowed.
  NO EXCEPTIONS. Use Pydantic BaseModel instead.

rule:
  any:
    - pattern: "@dataclass"
    - pattern: "@dataclass($$$ARGS)"
    - pattern: "from dataclasses import dataclass"

note: |
  ⛔ THIS RULE IS NON-NEGOTIABLE ⛔

  There are ZERO valid use cases for dataclass in this codebase.
  Do NOT:
  - Argue that "dataclass is lighter weight"
  - Claim "I don't need validation"
  - Suggest "it's just a simple data container"

  The answer is always NO. Use Pydantic BaseModel.

  Instead of:
    from dataclasses import dataclass  # ❌ NEVER DO THIS

    @dataclass
    class User:
        name: str
        age: int

  Use:
    from pydantic import BaseModel

    class User(BaseModel):
        name: str
        age: int

  Pydantic provides: validation, JSON serialization, schema generation, better IDE support.
