id: no-os-path-abspath
language: python
severity: warning
message: |
  Use Path.resolve() instead of os.path.abspath().

rule:
  any:
    - pattern: "os.path.abspath($PATH)"
    - pattern: "from os.path import abspath"

note: |
  pathlib provides a more object-oriented interface.
  
  Instead of:
    import os.path
    abs_path = os.path.abspath(relative_path)
  
  Use:
    from pathlib import Path
    abs_path = Path(relative_path).resolve()

