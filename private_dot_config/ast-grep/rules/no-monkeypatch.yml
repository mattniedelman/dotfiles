id: no-monkeypatch
language: python
severity: error
message: |
  ABSOLUTE PROHIBITION: monkeypatch is NEVER allowed.
  NO EXCEPTIONS. Use dependency injection or settings objects.

rule:
  any:
    - pattern: "monkeypatch.setattr($$$ARGS)"
    - pattern: "monkeypatch.setenv($$$ARGS)"
    - pattern: "monkeypatch.delattr($$$ARGS)"
    - pattern: "monkeypatch.delenv($$$ARGS)"
    - pattern: "monkeypatch.setitem($$$ARGS)"
    - pattern: "monkeypatch.delitem($$$ARGS)"

note: |
  ⛔ THIS RULE IS NON-NEGOTIABLE ⛔

  There are ZERO valid use cases for monkeypatch in this codebase.
  Do NOT:
  - Argue that "monkeypatch is a pytest feature"
  - Claim "I need to set environment variables"
  - Suggest "it's cleaner than mock.patch"

  The answer is always NO. Redesign to use dependency injection.

  Instead of:
    def test_something(monkeypatch):  # ❌ NEVER DO THIS
        monkeypatch.setattr(module, 'function', fake_function)
        ...

  Use dependency injection:
    def test_something():
        obj = MyClass(dependency=FakeDependency())
        ...

  For environment variables:
  - Pass config as parameters
  - Use a settings object that can be overridden in tests
  - Use pydantic-settings with test overrides
