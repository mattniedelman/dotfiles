id: no-time-sleep-in-tests
language: python
severity: error
message: |
  ABSOLUTE PROHIBITION: time.sleep() in tests is NEVER allowed.
  NO EXCEPTIONS. Use polling, events, or async patterns.

files:
  - "**/test_*.py"
  - "**/*_test.py"
  - "**/tests/**/*.py"
  - "**/conftest.py"

rule:
  pattern: "time.sleep($DURATION)"

note: |
  ⛔ THIS RULE IS NON-NEGOTIABLE ⛔

  There are ZERO valid use cases for time.sleep() in tests.
  Do NOT:
  - Argue that "it's just a short sleep"
  - Claim "I need to wait for the service"
  - Suggest "polling is more complex"

  The answer is always NO. Use proper synchronization.

  Instead of:
    def test_async_operation():
        start_operation()
        time.sleep(2)  # ❌ NEVER DO THIS
        assert is_complete()

  Use polling with timeout:
    def test_async_operation():
        start_operation()
        for _ in range(20):
            if is_complete():
                break
            time.sleep(0.1)  # Short poll interval is OK in polling loop
        assert is_complete()

  Or use async patterns:
    async def test_async_operation():
        await start_operation()
        await asyncio.wait_for(completion_event.wait(), timeout=2.0)
        assert is_complete()

  Or use tenacity:
    @retry(stop=stop_after_delay(2), wait=wait_fixed(0.1))
    def wait_for_complete():
        assert is_complete()
