[metadata]
name = "files"
description = "A channel to select files and directories"
requirements = ["bat"]

[source]
command = "bash -c 'if git rev-parse --git-dir > /dev/null 2>&1; then git ls-files && git ls-files --others --exclude-standard | grep -Ev \"(^|/)[.]\"; else fdfind -t f -H; fi'"
frecency = false
# no_sort = true

[preview]
command = "bat -n --color=always '{}'"
env = { BAT_THEME = "ansi" }

[keybindings]
shortcut = "f1"
f12 = "actions:edit"

[actions.edit]
description = "Opens the selected entries with the default editor (falls back to vim)"
command = "${EDITOR:-vim} '{}'"
# use `mode = "fork"` if you want to return to tv afterwards
mode = "execute"
