[env]
HK_MISE = "1"

[settings]
# plugins can read the versions files used by other version managers (if enabled by the plugin)
# for example, .nvmrc in the case of node's nvm

# configure `mise install` to always keep the downloaded archive
always_keep_download = false  # deleted after install by default
always_keep_install = false  # deleted on failure by default

# configure how frequently (in minutes) to fetch updated plugin repository changes
# this is updated whenever a new runtime is installed
plugin_autoupdate_last_check_duration = "1 week"  # set to 0 to disable updates

verbose = false  # set to true to see full installation output, see `MISE_VERBOSE`
http_timeout = "30s"  # set the timeout for http requests as duration string, see `MISE_HTTP_TIMEOUT`
jobs = 2  # number of plugins or runtimes to install in parallel
raw = false  # set to true to directly pipe plugins to stdin/stdout/stderr
yes = false  # set to true to automatically answer yes to all prompts

not_found_auto_install = true  # automatically install missing tools when command not found
paranoid = false  # see MISE_PARANOID

# disable_default_shorthands = false # disable the default shorthands, see `MISE_DISABLE_DEFAULT_SHORTHANDS`

env_file = ".env"  # load env vars from a dotenv file, see `MISE_ENV_FILE`

experimental = true  # enable experimental features

# configure messages displayed when entering directories with config files
status = { missing_tools = "if_other_versions_installed", show_env = false, show_tools = false }

# Enable reading native version files for these tools (.nvmrc, .python-version, etc.)
idiomatic_version_file_enable_tools = ["python", "node", "go", "java"]
lockfile = true
locked_verify_provenance = true

# Supply-chain cooldown: ignore versions newer than this window so the
# community has time to flag compromised releases before mise installs them.
# Applies to version-resolved backends (npm, pipx, cargo crates.io, github
# releases, etc). Does NOT affect `branch:main` git installs (no release date).
# NOTE: the per-tool exemption list (minimum_release_age_excludes) may or may
# not be supported by the current mise version -- check `mise doctor` output.
# If a security scanner's freshness matters more than the cooldown, pin it to
# an explicit recent version.
minimum_release_age = "7d"

[settings.github]
use_git_credentials = true

[tasks.upgrade]
description = "Upgrade all tools to latest versions"
run = "mise upgrade --bump"

[tasks.doctor]
description = "Check mise health and configuration"
run = "mise doctor"

[tasks.outdated]
description = "Show outdated tools"
run = "mise outdated"

[tasks.prune]
description = "Remove unused tool versions"
run = "mise prune"

# ── dotfiles ────────────────────────────────────────────────────────────────

[settings]
dotfiles.root = "~/.local/share/chezmoi/dotfiles"

[dotfiles]
# Plain symlinks — source inferred from dotfiles.root (mirrors ~/.*)
"~/.bashrc" = { mode = "symlink" }
"~/.profile" = { mode = "symlink" }
"~/.ripgreprc" = { mode = "symlink" }

# Templates
"~/.gitconfig" = { source = "~/.local/share/chezmoi/dotfiles/.gitconfig.tera", mode = "template" }

# ~/.config — whole-directory symlinks
"~/.config/nvim" = { mode = "symlink" }
"~/.config/television" = { mode = "symlink" }
"~/.config/ohmyposh" = { mode = "symlink" }
"~/.config/kitty" = { mode = "symlink" }
"~/.config/git" = { mode = "symlink" }
"~/.config/kubernetes-mcp-server" = { mode = "symlink" }
"~/.config/mdsf" = { mode = "symlink" }
"~/.config/ghostty" = { mode = "symlink" }
"~/.config/atuin" = { mode = "symlink" }
"~/.config/herdr" = { mode = "symlink" }

# ~/.config — file/dir-level entries (templates or non-standard source paths)
"~/.config/cbfmt.toml" = { source = "~/.local/share/chezmoi/dotfiles/.config/cbfmt.toml.tera", mode = "template" }
"~/.config/ast-grep/rules" = { source = "~/.local/share/chezmoi/dotfiles/.config/ast-grep/rules", mode = "symlink" }
"~/.config/ast-grep/sgconfig.yml" = { source = "~/.local/share/chezmoi/dotfiles/.config/ast-grep/sgconfig.yml.tera", mode = "template" }
"~/.config/mise/.default-python-packages" = { source = "~/.local/share/chezmoi/dotfiles/.config/mise/.default-python-packages", mode = "symlink" }

# ~/.config/fish — symlink-each so fish can write fish_variables, completions/, etc.
# config.fish is a template so excluded here and handled separately below.
"~/.config/fish" = { source = "~/.local/share/chezmoi/dotfiles/.config/fish", mode = "symlink-each", exclude = ["config.fish.tera", "fish_variables", "fish_variables.*", "completions/**", "logs/**", "themes/**"] }
"~/.config/fish/config.fish" = { source = "~/.local/share/chezmoi/dotfiles/.config/fish/config.fish.tera", mode = "template" }

# ~/.omp — symlink-each; agent/ has private files (config.yml, mcp.json)
"~/.omp" = { source = "~/.local/share/chezmoi/dotfiles/.omp", mode = "symlink-each" }

# ~/.claude — symlink-each; exclude all runtime/generated state
"~/.claude" = { source = "~/.local/share/chezmoi/dotfiles/.claude", mode = "symlink-each", exclude = [
  "hooks/*.tera",
  "sessions/**", "projects/**", "plugins/cache/**", "plugins/data/**", "plugins/marketplaces/**",
  "backups/**", "cache/**", "context-mode/**", "debug/**", "downloads/**", "file-history/**",
  "openspec/**", "paste-cache/**", "plans/**", "powerline/**", "shell-snapshots/**",
  "session-env/**", "tasks/**", "telemetry/**", "usage-data/**",
  ".beads/**", ".ralph/**", ".serena/**", ".claude/**",
  ".git/**", ".gitignore", "headroom_memory*", "history.jsonl",
  "stats-cache.json", "hook-approvals.log", "security_warnings_state_*",
  "__pycache__/**", "*.pyc", "install-counts-cache.json",
] }
# Template hooks (rendered with +x from source permissions)
"~/.claude/hooks/ascii_check.py" = { source = "~/.local/share/chezmoi/dotfiles/.claude/hooks/ascii_check.py.tera", mode = "template" }
"~/.claude/hooks/auto_lint.py" = { source = "~/.local/share/chezmoi/dotfiles/.claude/hooks/auto_lint.py.tera", mode = "template" }
"~/.claude/hooks/basic_memory_directory_check.sh" = { source = "~/.local/share/chezmoi/dotfiles/.claude/hooks/basic_memory_directory_check.sh.tera", mode = "template" }
"~/.claude/hooks/block_pip.py" = { source = "~/.local/share/chezmoi/dotfiles/.claude/hooks/block_pip.py.tera", mode = "template" }
"~/.claude/hooks/reflect_backfill.py" = { source = "~/.local/share/chezmoi/dotfiles/.claude/hooks/reflect_backfill.py.tera", mode = "template" }
"~/.claude/hooks/session_reflect.py" = { source = "~/.local/share/chezmoi/dotfiles/.claude/hooks/session_reflect.py.tera", mode = "template" }
"~/.claude/hooks/session_start.py" = { source = "~/.local/share/chezmoi/dotfiles/.claude/hooks/session_start.py.tera", mode = "template" }

# ── systemd user services (replaces chezmoi-placed unit files) ──────────────

[bootstrap.linux.systemd.units.basic-memory]
description = "Basic Memory MCP Server (Streamable HTTP)"
exec_start = "~/.local/share/mise/shims/basic-memory mcp --transport streamable-http --host 127.0.0.1"
after = ["network.target"]
restart = "on-failure"
restart_sec = "5s"

# ── history watcher service ──────────────────────────────────────────────────

[bootstrap.services.mise-history]
builtin = "history-watch"

# ── shell activation ─────────────────────────────────────────────────────────

[bootstrap.mise_shell_activate]
fish = "activate"

# ── user settings ────────────────────────────────────────────────────────────

[bootstrap.user]
login_shell = "fish"

# ── SSH keys task (replaces authorized_keys template) ───────────────────────

[tasks.sync-ssh-keys]
description = "Fetch GitHub SSH keys into authorized_keys (run on servers you SSH into)"
run = """
mkdir -p ~/.ssh && chmod 700 ~/.ssh
gh api /users/mattniedelman/keys --jq '.[].key' > ~/.ssh/authorized_keys
chmod 600 ~/.ssh/authorized_keys
"""

# ── bootstrap verification task ──────────────────────────────────────────────

[tasks.bootstrap]
description = "Post-bootstrap verification"
run = "mise doctor"
