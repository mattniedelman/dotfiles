"pipx:basedpyright" = "latest"  # Enhanced fork of pyright with additional features
"pipx:aws-sso-util" = "latest"
"pipx:ruff" = "latest"
"pipx:sshuttle" = "latest"
# Removed duplicate pyright - basedpyright provides superset functionality
delta = "latest"
podman = "latest"
kubectx = "latest"
ast-grep = "latest"
yamlfmt = "latest"
"npm:doctoc" = "latest"
"pipx:crawl4ai" = "latest"
