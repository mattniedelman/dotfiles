# Production overrides. Apply with: helm upgrade --install webapp ./webapp -f values-prod.yaml
image:
  tag: "1.0.0"

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 70

resources:
  requests:
    cpu: 250m
    memory: 256Mi
  limits:
    memory: 512Mi

podDisruptionBudget:
  enabled: true
  minAvailable: 2

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: webapp.prod.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: webapp-prod-tls
      hosts:
        - webapp.prod.example.com

# Reference an externally-managed secret -- never inline credentials.
secret:
  existingSecret: webapp-prod-credentials
