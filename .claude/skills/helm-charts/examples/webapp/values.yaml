# Default values for webapp. This is the contract the templates consume.
# Every key is documented (helm-docs `# --` format) and has a sensible default
# so the chart installs out of the box.

# -- Number of replicas. Ignored when autoscaling.enabled is true (the HPA owns the count).
replicaCount: 2

image:
  # -- Image repository. Pin a real registry path in your environment.
  repository: ghcr.io/example/webapp
  # -- Image tag. Empty string falls back to .Chart.AppVersion (reproducible default).
  tag: ""
  # -- Pull policy. IfNotPresent for pinned tags; Always only for mutable dev tags.
  pullPolicy: IfNotPresent

# -- Image pull secrets (list of {name: ...}).
imagePullSecrets: []

# -- Override the chart name in resource names.
nameOverride: ""
# -- Override the fully qualified app name.
fullnameOverride: ""

# -- Non-sensitive config rendered into a ConfigMap and injected via envFrom.
config:
  LOG_LEVEL: info
  # Quote large integers so they do not serialize as scientific notation (1e+06).
  MAX_CONNECTIONS: "1000000"

secret:
  # -- Reference an externally-managed Secret (External Secrets Operator, Vault,
  # Sealed Secrets, SOPS). This is the default: secrets never live in values.
  existingSecret: ""
  # -- Opt-in only: render a chart-managed Secret from these key/value pairs.
  # Leave empty in real deployments. Values here land in release history in plaintext.
  create: false
  data: {}

serviceAccount:
  # -- Create a dedicated ServiceAccount.
  create: true
  # -- Name to use. Empty -> derived from fullname when create=true, else "default".
  name: ""
  # -- Mount the SA token. Off unless the app calls the Kubernetes API.
  automount: false

service:
  type: ClusterIP
  port: 80

# -- Container port the app listens on.
containerPort: 8080

probes:
  liveness:
    path: /healthz
    initialDelaySeconds: 5
    periodSeconds: 10
  readiness:
    path: /ready
    initialDelaySeconds: 3
    periodSeconds: 5
  startup:
    path: /healthz
    failureThreshold: 30
    periodSeconds: 5

# -- Resource requests/limits. Requests always set. CPU limit omitted by default
# (CFS throttling on latency-sensitive apps); add per-environment if quota requires.
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 256Mi

# -- Pod-level security context (hardened baseline).
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001
  seccompProfile:
    type: RuntimeDefault

# -- Container-level security context (hardened baseline).
securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

autoscaling:
  # -- Enable an HPA. When true the Deployment omits replicas so the HPA owns it.
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 80
  # -- Optional memory target. Null disables the memory metric.
  targetMemoryUtilizationPercentage: null

ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: webapp.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

# -- Pod disruption budget. Set minAvailable OR maxUnavailable, not both.
podDisruptionBudget:
  enabled: false
  minAvailable: 1

# -- Extra environment variables (list of core/v1 EnvVar).
extraEnv: []
# -- Node selector / tolerations / affinity passthroughs.
nodeSelector: {}
tolerations: []
affinity: {}
