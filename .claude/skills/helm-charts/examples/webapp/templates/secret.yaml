{{- /*
Chart-managed secret is OPT-IN ONLY (secret.create=true). The default path
references an externally-managed secret via secret.existingSecret. Values placed
here land in Helm release history in plaintext -- prefer External Secrets
Operator / Vault / Sealed Secrets / SOPS. See reference.md for the `lookup`
pattern that preserves a generated value across upgrades.
*/ -}}
{{- if .Values.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "webapp.fullname" . }}
  labels:
    {{- include "webapp.labels" . | nindent 4 }}
type: Opaque
data:
  {{- range $key, $value := .Values.secret.data }}
  {{ $key }}: {{ $value | b64enc | quote }}
  {{- end }}
{{- end }}
