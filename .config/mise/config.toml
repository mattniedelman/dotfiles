[env]
HK_MISE = "1"
SKILLSPECTOR_PROVIDER = "openai_compatible"
SKILLSPECTOR_COMPAT_BASE_URL = "http://localhost:4000/v1"
SKILLSPECTOR_COMPAT_API_KEY = "local"
SKILLSPECTOR_MODEL = "unsloth/Qwen3.6-35B-A3B-NVFP4-Fast"

[settings]
# plugins can read the versions files used by other version managers (if enabled by the plugin)
# for example, .nvmrc in the case of node's nvm

# configure `mise install` to always keep the downloaded archive
always_keep_download = false  # deleted after install by default
always_keep_install = false  # deleted on failure by default


verbose = false  # set to true to see full installation output, see `MISE_VERBOSE`
http_timeout = "30s"  # set the timeout for http requests as duration string, see `MISE_HTTP_TIMEOUT`
jobs = 10  # number of plugins or runtimes to install in parallel
raw = false  # set to true to directly pipe plugins to stdin/stdout/stderr
yes = false  # set to true to automatically answer yes to all prompts

not_found_auto_install = true  # automatically install missing tools when command not found
paranoid = false  # see MISE_PARANOID

# disable_default_shorthands = false # disable the default shorthands, see `MISE_DISABLE_DEFAULT_SHORTHANDS`

env_file = ".env"  # load env vars from a dotenv file, see `MISE_ENV_FILE`

experimental = true  # enable experimental features

# configure messages displayed when entering directories with config files
status = { missing_tools = "if_other_versions_installed", show_env = false, show_tools = false }

# Enable reading native version files for these tools (.nvmrc, .python-version, etc.)
idiomatic_version_file_enable_tools = ["python", "node", "java"]
lockfile = true
locked_verify_provenance = true

# Supply-chain cooldown: ignore versions newer than this window so the
# community has time to flag compromised releases before mise installs them.
# Applies to version-resolved backends (npm, pipx, cargo crates.io, github
# releases, etc). Does NOT affect `branch:main` git installs (no release date).
# NOTE: the per-tool exemption list (minimum_release_age_excludes) may or may
# not be supported by the current mise version -- check `mise doctor` output.
# If a security scanner's freshness matters more than the cooldown, pin it to
# an explicit recent version.
minimum_release_age = "7d"
auto_update = true

[settings.github]
use_git_credentials = true

[tasks.upgrade]
description = "Upgrade all tools to latest versions"
run = "mise upgrade --bump"

[tasks.doctor]
description = "Check mise health and configuration"
run = "mise doctor"

[tasks.outdated]
description = "Show outdated tools"
run = "mise outdated"

[tasks.prune]
description = "Remove unused tool versions"
run = "mise prune"

# ── dotfiles repo ────────────────────────────────────────────────────────────

[bootstrap.repos."~/.dotfiles"]
url = "git@github-personal:mattniedelman/dotfiles.git"

# ── apt repo setup (pre-packages phase) ─────────────────────────────────────

[bootstrap.directories."/etc/apt/keyrings"]
owner = "root"
group = "root"
mode = "0755"
phase = "pre-packages"

[bootstrap.hooks.pre-packages]
run = [
  "sudo curl -fsSL 'https://keyserver.ubuntu.com/pks/lookup?fingerprint=on&op=get&search=0x88421E703EDC7AF54967DED473C9FCC9E2BB48DA' -o /etc/apt/keyrings/fish-shell.asc.tmp && sudo chmod 0644 /etc/apt/keyrings/fish-shell.asc.tmp && sudo mv /etc/apt/keyrings/fish-shell.asc.tmp /etc/apt/keyrings/fish-shell.asc",
  "sudo curl -fsSL 'https://cli.github.com/packages/githubcli-archive-keyring.gpg' -o /etc/apt/keyrings/githubcli-archive-keyring.gpg.tmp && sudo chmod 0644 /etc/apt/keyrings/githubcli-archive-keyring.gpg.tmp && sudo mv /etc/apt/keyrings/githubcli-archive-keyring.gpg.tmp /etc/apt/keyrings/githubcli-archive-keyring.gpg",
  "sudo curl -fsSL 'https://pkgs.tailscale.com/stable/ubuntu/noble.noarmor.gpg' -o /etc/apt/keyrings/tailscale-archive-keyring.gpg.tmp && sudo chmod 0644 /etc/apt/keyrings/tailscale-archive-keyring.gpg.tmp && sudo mv /etc/apt/keyrings/tailscale-archive-keyring.gpg.tmp /etc/apt/keyrings/tailscale-archive-keyring.gpg",
  "sudo curl -fsSL 'https://downloads.1password.com/linux/keys/1password.asc' -o /etc/apt/keyrings/1password.asc.tmp && sudo chmod 0644 /etc/apt/keyrings/1password.asc.tmp && sudo mv /etc/apt/keyrings/1password.asc.tmp /etc/apt/keyrings/1password.asc",
  "sudo curl -fsSL 'https://keyserver.ubuntu.com/pks/lookup?fingerprint=on&op=get&search=0x0721FDF5FECB88DC6920361657C8EF455CEAE491' -o /etc/apt/keyrings/ghostty.asc.tmp && sudo chmod 0644 /etc/apt/keyrings/ghostty.asc.tmp && sudo mv /etc/apt/keyrings/ghostty.asc.tmp /etc/apt/keyrings/ghostty.asc",
  "sudo curl -fsSL 'https://raw.githubusercontent.com/imputnet/helium-linux/main/pubkey.asc' -o /etc/apt/keyrings/helium.asc.tmp && sudo chmod 0644 /etc/apt/keyrings/helium.asc.tmp && sudo mv /etc/apt/keyrings/helium.asc.tmp /etc/apt/keyrings/helium.asc",
]

# fish shell 4.x PPA — Ubuntu noble (24.04) only
# If upgrading Ubuntu: update Suites and check for a new PPA release series
[bootstrap.files."/etc/apt/sources.list.d/fish-shell.sources"]
source = "./files/apt/fish-shell.sources"
owner = "root"
group = "root"
mode = "0644"
phase = "pre-packages"

# GitHub CLI apt repo; keyring is refreshed by the pre-packages hook
[bootstrap.files."/etc/apt/sources.list.d/github-cli.sources"]
source = "./files/apt/github-cli.sources"
owner = "root"
group = "root"
mode = "0644"
phase = "pre-packages"

# Tailscale VPN
[bootstrap.files."/etc/apt/sources.list.d/tailscale.sources"]
source = "./files/apt/tailscale.sources"
owner = "root"
group = "root"
mode = "0644"
phase = "pre-packages"

# 1Password
[bootstrap.files."/etc/apt/sources.list.d/1password.sources"]
source = "./files/apt/1password.sources"
owner = "root"
group = "root"
mode = "0644"
phase = "pre-packages"

# Ghostty terminal — community PPA (noble/24.04 only)
[bootstrap.files."/etc/apt/sources.list.d/ghostty.sources"]
source = "./files/apt/ghostty.sources"
owner = "root"
group = "root"
mode = "0644"
phase = "pre-packages"

# Helium browser
[bootstrap.files."/etc/apt/sources.list.d/helium.sources"]
source = "./files/apt/helium.sources"
owner = "root"
group = "root"
mode = "0644"
phase = "pre-packages"

