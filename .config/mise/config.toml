# ── dotfiles ────────────────────────────────────────────────────────────────


[dotfiles]
# Plain symlinks — source inferred from dotfiles.root (mirrors ~/.*)
"~/.bashrc" = { mode = "symlink" }

# ~/.claude — symlink-each; exclude all runtime/generated state
"~/.claude" = { mode = "symlink-each", exclude = [
  "hooks/*.tera",
  "sessions/**", "projects/**", "plugins/cache/**", "plugins/data/**", "plugins/marketplaces/**",
  "backups/**", "cache/**", "context-mode/**", "debug/**", "downloads/**", "file-history/**",
  "openspec/**", "paste-cache/**", "plans/**", "powerline/**", "shell-snapshots/**",
  "session-env/**", "tasks/**", "telemetry/**", "usage-data/**",
  ".beads/**", ".ralph/**", ".serena/**", ".claude/**",
  ".git/**", ".gitignore", "headroom_memory*", "history.jsonl",
  "stats-cache.json", "hook-approvals.log", "security_warnings_state_*",
  "__pycache__/**", "*.pyc", "install-counts-cache.json",
] }
"~/.config/ast-grep/rules" = { mode = "symlink" }
"~/.config/ast-grep/sgconfig.yml" = { mode = "symlink" }
"~/.config/atuin" = { mode = "copy" }
"~/.config/atuin/config.toml" = { mode = "track" }
"~/.config/bd/config.yaml" = { mode = "track" }

# ~/.config — file/dir-level entries
"~/.config/cbfmt.toml" = { mode = "symlink" }

# ~/.config/fish — symlink-each so fish can write fish_variables, completions/, etc.
"~/.config/fish" = { mode = "symlink-each", exclude = ["fish_variables", "fish_variables.*", "completions/**", "logs/**", "themes/**"] }

# ~/.config — copy mode (edit in-place; tracked for local undo history)
"~/.config/ghostty" = { mode = "copy" }
"~/.config/ghostty/config" = { mode = "track" }
"~/.config/git" = { mode = "symlink" }
"~/.config/herdr/config.toml" = { mode = "copy" }
"~/.config/kitty" = { mode = "symlink" }
"~/.config/kubernetes-mcp-server" = { mode = "symlink" }
"~/.config/mdsf" = { mode = "symlink" }
"~/.config/mise/.default-python-packages" = { mode = "symlink" }
"~/.config/mise/conf.d/dotfiles-tracking.toml" = { mode = "symlink" }
"~/.config/mise/conf.d/pi-configuration.toml" = { mode = "symlink" }
"~/.config/mise/config.toml" = { mode = "symlink" }
"~/.config/mise/files" = { mode = "symlink" }

# ~/.config — whole-directory symlinks (set-and-forget, edit via source)
"~/.config/nvim" = { mode = "symlink-each", manifest = "git" }
"~/.config/ohmyposh" = { mode = "copy" }
"~/.config/ohmyposh/claude.json" = { mode = "track" }
# ~/.config/systemd/user — template services that can't be expressed in
# [bootstrap.linux.systemd.units] (instantiated template, no WantedBy)
"~/.config/systemd/user/notify-rclone-failure@.service" = { mode = "symlink" }
"~/.config/television" = { mode = "symlink" }

# Home root
"~/.gitconfig" = { mode = "symlink" }

# ~/.omp — symlink-each; agent/ has private files (config.yml, mcp.json)
"~/.omp" = { mode = "symlink-each" }
"~/.profile" = { mode = "symlink" }
"~/.ripgreprc" = { mode = "symlink" }

