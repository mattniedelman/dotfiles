id: no-subprocess-shell-true
language: python
severity: error
message: |
  subprocess with shell=True is a security risk. Use a list of arguments instead.

rule:
  any:
    # subprocess.run
    - pattern: "subprocess.run($CMD, shell=True)"
    - pattern: "subprocess.run($CMD, shell=True, $$$REST)"
    - pattern: "subprocess.run($CMD, $$$BEFORE, shell=True)"
    - pattern: "subprocess.run($CMD, $$$BEFORE, shell=True, $$$AFTER)"
    # subprocess.call
    - pattern: "subprocess.call($CMD, shell=True)"
    - pattern: "subprocess.call($CMD, shell=True, $$$REST)"
    - pattern: "subprocess.call($CMD, $$$BEFORE, shell=True)"
    - pattern: "subprocess.call($CMD, $$$BEFORE, shell=True, $$$AFTER)"
    # subprocess.Popen
    - pattern: "subprocess.Popen($CMD, shell=True)"
    - pattern: "subprocess.Popen($CMD, shell=True, $$$REST)"
    - pattern: "subprocess.Popen($CMD, $$$BEFORE, shell=True)"
    - pattern: "subprocess.Popen($CMD, $$$BEFORE, shell=True, $$$AFTER)"
    # subprocess.check_output
    - pattern: "subprocess.check_output($CMD, shell=True)"
    - pattern: "subprocess.check_output($CMD, shell=True, $$$REST)"
    - pattern: "subprocess.check_output($CMD, $$$BEFORE, shell=True)"
    - pattern: "subprocess.check_output($CMD, $$$BEFORE, shell=True, $$$AFTER)"
    # subprocess.check_call
    - pattern: "subprocess.check_call($CMD, shell=True)"
    - pattern: "subprocess.check_call($CMD, shell=True, $$$REST)"
    - pattern: "subprocess.check_call($CMD, $$$BEFORE, shell=True)"
    - pattern: "subprocess.check_call($CMD, $$$BEFORE, shell=True, $$$AFTER)"

note: |
  shell=True passes the command through the shell, enabling shell injection
  attacks if any part of the command comes from untrusted input.

  Instead of:
    subprocess.run(f"ls {user_dir}", shell=True)

  Use:
    subprocess.run(["ls", user_dir])

  Benefits of using a list:
  - No shell injection vulnerability
  - Arguments are properly escaped
  - More predictable behavior across platforms
