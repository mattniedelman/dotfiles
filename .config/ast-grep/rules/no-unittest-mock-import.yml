id: no-unittest-mock-import
language: python
severity: error
message: |
  ABSOLUTE PROHIBITION: unittest.mock is NEVER allowed.
  NO EXCEPTIONS. Use dependency injection, fakes, or real implementations.

rule:
  any:
    - pattern: from unittest.mock import $$$
    - pattern: from unittest import mock
    - pattern: import unittest.mock

note: |
  ⛔ THIS RULE IS NON-NEGOTIABLE ⛔

  There are ZERO valid use cases for unittest.mock in this codebase.
  Do NOT:
  - Argue that "mocking is standard practice"
  - Claim "I need to mock this external service"
  - Suggest "it's just for this one test"

  The answer is always NO. Redesign to use dependency injection.

  Mandatory alternatives:
  - Dependency injection with fake implementations
  - In-memory databases (SQLite, DuckDB)
  - Lightweight test fakes that mirror real behavior
  - Extract pure functions that don't need mocking
  - pytest fixtures with real objects
