id: no-exec
language: python
severity: error
message: |
  ABSOLUTE PROHIBITION: exec() is NEVER allowed.
  NO EXCEPTIONS. This is a critical security vulnerability.

rule:
  pattern: "exec($$$ARGS)"

note: |
  ⛔ THIS RULE IS NON-NEGOTIABLE ⛔

  There are ZERO valid use cases for exec() in this codebase.
  Do NOT:
  - Argue that "the code is generated internally"
  - Claim "it's sandboxed"
  - Suggest "I need dynamic code execution"

  The answer is always NO. Use safe alternatives.

  Mandatory alternatives:
  - Plugin system with well-defined interfaces
  - Configuration-driven behavior
  - Strategy pattern for runtime behavior selection
  - importlib for dynamic module loading
