id: no-continue-statement
language: python
severity: error
message: |
  ABSOLUTE PROHIBITION: 'continue' statements are NEVER allowed.
  NO EXCEPTIONS. Refactor using filtering or if/else blocks.

rule:
  kind: continue_statement

note: |
  ⛔ THIS RULE IS NON-NEGOTIABLE ⛔

  There are ZERO valid use cases for 'continue' in this codebase.
  Do NOT:
  - Argue that "this case is different"
  - Claim "continue is more readable here"
  - Suggest "it's just one continue"

  The answer is always NO. Refactor the code.

  Instead of:
    for item in items:
        if not item.valid:
            continue  # ❌ NEVER DO THIS
        process(item)

  Use filtering:
    valid_items = [item for item in items if item.valid]
    for item in valid_items:
        process(item)

  Or if/else:
    for item in items:
        if item.valid:
            process(item)
