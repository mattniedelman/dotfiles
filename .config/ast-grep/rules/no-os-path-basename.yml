id: no-os-path-basename
language: python
severity: warning
message: |
  Avoid os.path.basename(). Use pathlib.Path.name instead.

rule:
  pattern: os.path.basename($PATH)

fix: Path($PATH).name

note: |
  From python-development.md:
  "Use pathlib.Path not os.path"

  Instead of:
    filename = os.path.basename(file_path)

  Use:
    filename = Path(file_path).name
