[project]
name = "augment-skillers"
version = "0.1.0"
description = "Observation-driven skill suggestions for Augment CLI"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.0", "plyvel>=1.5.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
skillers = "skillers.cli:main"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "C90"]

[tool.ty]
# ty can't resolve runtime sys.path modifications, so we skip strict checking

