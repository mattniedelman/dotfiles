id: no-nested-function
language: python
severity: error
message: |
  ABSOLUTE PROHIBITION: Nested functions are NEVER allowed.
  NO EXCEPTIONS. Extract to module level with underscore prefix (e.g., _helper_name).

# Match: function defined inside another function
# This catches both:
#   - def outer(): def inner(): ...  (module level)
#   - class Foo: def method(self): def inner(): ...  (inside class methods)
rule:
  kind: function_definition
  inside:
    stopBy: end
    kind: function_definition

note: |
  ⛔ THIS RULE IS NON-NEGOTIABLE ⛔

  There are ZERO valid use cases for nested functions in this codebase.
  Do NOT:
  - Argue that "closures are Pythonic"
  - Claim "decorators need nested functions" (use functools.wraps at module level)
  - Suggest "it's just a small helper"

  The answer is always NO. Extract to module level.

  Instead of:
    def outer():
        def inner(x):  # ❌ NEVER DO THIS
            return x * 2
        return inner(5)

  Use:
    def _inner_impl(x):
        return x * 2

    def outer():
        return _inner_impl(5)
