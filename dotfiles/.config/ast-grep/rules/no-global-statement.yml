id: no-global-statement
language: python
severity: error
message: |
  ABSOLUTE PROHIBITION: The 'global' keyword is NEVER allowed.
  NO EXCEPTIONS. NO SPECIAL CASES. Do not attempt to justify or rationalize.
  Refactor to pass values as parameters and return modified values.

rule:
  kind: global_statement

note: |
  ⛔ THIS RULE IS NON-NEGOTIABLE ⛔

  There are ZERO valid use cases for 'global' in this codebase.
  Do NOT:
  - Argue that "this case is different"
  - Claim it's "necessary for this pattern"
  - Suggest it's "okay just this once"
  - Add a suppression comment

  The answer is always NO. Refactor the code instead.

  Instead of:
    counter = 0

    def increment():
        global counter  # ❌ NEVER DO THIS
        counter += 1

  Use:
    def increment(counter: int) -> int:
        return counter + 1

    counter = increment(counter)
