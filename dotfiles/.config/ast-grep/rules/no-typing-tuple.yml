id: no-typing-tuple
language: python
severity: warning
message: |
  Use built-in tuple[T, ...] instead of typing.Tuple[T, ...] (Python 3.9+).

rule:
  any:
    - pattern: "Tuple[$$$TYPES]"
    - pattern: "from typing import Tuple"

note: |
  From python-development.md:
  "Modern Python 3.9+ syntax"

  Instead of:
    from typing import Tuple
    def get_coords() -> Tuple[int, int]:
        ...

  Use:
    def get_coords() -> tuple[int, int]:
        ...
