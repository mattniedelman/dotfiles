id: no-lambda-assignment
language: python
severity: warning
message: |
  Don't assign lambdas to variables. Use def instead.

rule:
  kind: assignment
  has:
    kind: lambda
    field: right

note: |
  PEP 8 recommends using def for named functions. Lambdas should
  be anonymous (used inline).

  Instead of:
    double = lambda x: x * 2
    is_even = lambda n: n % 2 == 0
    greet = lambda name: f"Hello, {name}"

  Use def:
    def double(x):
        return x * 2

    def is_even(n: int) -> bool:
        return n % 2 == 0

    def greet(name: str) -> str:
        return f"Hello, {name}"

  Benefits of def:
  - Can have docstrings
  - Better stack traces (named function vs <lambda>)
  - Can have type annotations
  - More readable for complex logic

  Lambdas are appropriate for:
    sorted(items, key=lambda x: x.name)
    map(lambda x: x * 2, numbers)
    filter(lambda x: x > 0, numbers)
