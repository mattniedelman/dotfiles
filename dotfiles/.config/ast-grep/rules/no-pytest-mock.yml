id: no-pytest-mock
language: python
severity: error
message: |
  ABSOLUTE PROHIBITION: pytest-mock is NEVER allowed.
  NO EXCEPTIONS. Use dependency injection, fakes, or real implementations.

rule:
  any:
    - pattern: from pytest_mock import $$$
    - pattern: import pytest_mock

note: |
  ⛔ THIS RULE IS NON-NEGOTIABLE ⛔

  There are ZERO valid use cases for pytest-mock in this codebase.
  Do NOT:
  - Argue that "mocker fixture is convenient"
  - Claim "I just need to mock one thing"
  - Suggest "it's the pytest way"

  The answer is always NO. Redesign to use dependency injection.

  Mandatory alternatives:
  - Dependency injection with fake implementations
  - In-memory databases (SQLite, DuckDB)
  - Lightweight test fakes that mirror real behavior
  - Extract pure functions that don't need mocking
  - pytest fixtures with real objects
