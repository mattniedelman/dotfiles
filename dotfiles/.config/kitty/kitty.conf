# term xterm-kitty
copy_on_select yes
font_family      Hack Nerd Font
font_size 13.0
scrollback_lines 100000
scrollback_pager_history_size 4096

active_border_color #bf616a
inactive_border_color #2E3440
draw_minimal_borders no
hide_window_decorations no

include current-theme.conf
strip_trailing_spaces smart
allow_remote_control yes
listen_on unix:@kitty
enabled_layouts splits,stack

map ctrl+shift+l next_layout
map ctrl+alt+z toggle_layout stack

map ctrl+\ launch --location=vsplit --cwd=current
map ctrl+- launch --location=hsplit --cwd=current
map ctrl+home resize_window reset

map ctrl+j kitten pass_keys.py bottom ctrl+j
map ctrl+k kitten pass_keys.py top    ctrl+k
map ctrl+h kitten pass_keys.py left   ctrl+h
map ctrl+l kitten pass_keys.py right  ctrl+l


mouse_map left click ungrabbed mouse_handle_click selection prompt
focus_follows_mouse no
linux_display_server x11

paste_actions quote-urls-at-prompt,replace-dangerous-control-codes

# Disable bell notifications
enable_audio_bell no
visual_bell_duration 0.0
