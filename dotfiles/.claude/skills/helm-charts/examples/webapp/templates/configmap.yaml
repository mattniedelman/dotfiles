apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "webapp.fullname" . }}
  labels:
    {{- include "webapp.labels" . | nindent 4 }}
data:
  {{- range $key, $value := .Values.config }}
  # quote so numeric-looking values (and large ints) reach the app as strings.
  {{ $key }}: {{ $value | quote }}
  {{- end }}
